{% extends "base.html" %}

{% block title %}

Login

{% endblock %}

{% block content %}

<h2>Student Login</h2>

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control">

</div>

<button class="btn btn-primary">

Login

</button>

</form>

{% endblock %}
