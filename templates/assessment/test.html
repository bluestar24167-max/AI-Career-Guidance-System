{% extends "base.html" %}

{% block title %}
AI Aptitude Test
{% endblock %}

{% block content %}

<div class="container mt-5">

<h2 class="mb-4">
{{ role }} Aptitude Test
</h2>

<form method="post">

{% csrf_token %}

{% for question in questions %}

<div class="card mb-4">

<div class="card-body">

<h5>{{ forloop.counter }}. {{ question.question }}</h5>

{% for option in question.options %}

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="q{{ forloop.parentloop.counter0 }}"
value="{{ option }}"
required>

<label class="form-check-label">

{{ option }}

</label>

</div>

{% endfor %}

</div>

</div>

{% endfor %}

<button class="btn btn-primary">
Submit Test
</button>

</form>

</div>

{% endblock %}
