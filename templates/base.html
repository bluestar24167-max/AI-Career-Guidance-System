{% load static %}
<!DOCTYPE html><html lang="en"><head>
    <link rel="manifest" href="{% static 'manifest.json' %}">

<meta name="theme-color" content="#6c63ff">

<link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Personalised AI career guidance and learning roadmaps.">
<title>{% block title %}CareerFlow{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <nav class="navbar navbar-expand-lg site-nav">
        <div class="container">
            <a class="navbar-brand" href="/">
            <span class="brand-mark">✦</span> Career<span>Flow</span>
        </a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav">
            <span class="navbar-toggler-icon"></span>
        </button><div class="collapse navbar-collapse" id="siteNav">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                {% if request.session.student_id %}
                <a href="/dashboard/" class="nav-link">Dashboard</a>
                <a href="/logout/" class="btn btn-outline-primary btn-sm">Log out</a>
                {% else %}
                <a href="/login/" class="nav-link">Log in</a>
                <a href="/register/" class="btn btn-primary btn-sm">Get started <span>→</span></a>
                {% endif %}</div></div></div></nav><main class="container app-main">
                    {% block content %}{% endblock %}</main>
                    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
                    <script>document.querySelectorAll('.reveal').forEach((e)=>new IntersectionObserver((x,o)=>x.forEach(i=>{if(i.isIntersecting){i.target.classList.add('is-visible');o.unobserve(i.target)}}),{threshold:.12}).observe(e));</script>
                    <script src="{% static 'js/pwa.js' %}"></script>
                </body>
                </html>
