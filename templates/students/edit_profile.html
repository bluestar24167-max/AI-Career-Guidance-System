{% extends "base.html" %}{% block title %}Edit Profile{% endblock %}{% block content %}<section class="form-page page-enter"><div class="form-heading"><span class="eyebrow">MAKE IT PERSONAL</span><h1>Tell us more about you.</h1><p>Your profile gives the career guidance engine the context it needs to make good recommendations.</p></div><form method="POST" class="content-card profile-form">{% csrf_token %}<div class="form-section"><h2>Education</h2><div class="row g-3"><div class="col-md-6"><label>Education</label><input type="text" name="education" class="form-control" value="{{ student.education }}"></div><div class="col-md-6"><label>College</label><input type="text" name="college" class="form-control" value="{{ student.college }}"></div><div class="col-md-6"><label>Branch / specialisation</label><input type="text" name="branch" class="form-control" value="{{ student.branch }}"></div><div class="col-md-3"><label>Phone</label><input type="text" name="phone" class="form-control" value="{{ student.phone }}"></div><div class="col-md-3"><label>City</label><input type="text" name="city" class="form-control" value="{{ student.city }}"></div></div></div><div class="form-section"><h2>Career direction</h2><div class="row g-3"><div class="col-md-6"><label>Skills <small>Separate with commas</small></label><textarea name="skills" class="form-control" rows="4" placeholder="e.g. Python, public speaking, Figma">{{ student.skills }}</textarea></div><div class="col-md-6"><label>Interests <small>Separate with commas</small></label><textarea name="interests" class="form-control" rows="4" placeholder="e.g. Data, design, helping people">{{ student.interests }}</textarea></div></div></div><div class="form-actions"><a href="/profile/" class="btn btn-light">Cancel</a><button class="btn btn-primary">Save profile <span>→</span></button></div></form></section>{% endblock %}
